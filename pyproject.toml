[project]
name = "sc2koach"
version = "0.1.0"
description = "StarCraft II team-game replay coach: replay -> metrics -> findings -> Markdown report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sc2reader>=1.9",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.scripts]
sc2koach = "sc2koach.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sc2koach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["replays: needs local replay files (skipped when absent)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
